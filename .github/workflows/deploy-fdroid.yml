name: Build & Deploy F-Droid Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install fdroidserver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdroidserver

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          chmod 600 keystore.jks

      - name: Generate config.yml
        env:
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FDROID_KEYSTORE_ALIAS }}
        run: |
          cat << EOF > config.yml
          repo_url: "https://fdroid.pixelabs.in/repo"
          repo_name: "Pixelabs F-Droid Repository"
          repo_icon: "icon.png"
          repo_description: "Official F-Droid repository for Pixelabs open-source Android applications."
          archive_older: 0
          keystore: "keystore.jks"
          repo_keyalias: "${KEY_ALIAS:-fdroid}"
          keystorepass: "${KEYSTORE_PASS}"
          keypass: "${KEYSTORE_PASS}"
          EOF

      - name: Fetch latest Calculator release APK if needed
        run: |
          mkdir -p repo
          if [ ! -f repo/calculator-v19.9.2-universal.apk ]; then
            echo "Downloading latest release APK..."
            curl -sL -o repo/calculator-v19.9.2-universal.apk \
              "https://github.com/PixelabsDev/Calculator/releases/download/v19.9.2/calculator-v19.9.2-universal.apk"
          fi

      - name: Run fdroid update
        run: |
          fdroid update --create-metadata --pretty

      - name: Prepare GitHub Pages Distribution
        run: |
          mkdir -p public
          cp -r repo public/
          cp icon.png public/
          cp calculator-icon.png public/
          cp index.html public/
          echo "fdroid.pixelabs.in" > public/CNAME
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Clean up Keystore
        if: always()
        run: |
          shred -u -z keystore.jks 2>/dev/null || rm -f keystore.jks config.yml
